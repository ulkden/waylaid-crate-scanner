name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: .

      - name: StyLua (format check)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check .

      - name: Python syntax (data generator)
        run: python3 -m py_compile tools/*.py

  test:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run test harness
        run: luajit tools/test_harness.lua WaylaidCrateScanner
